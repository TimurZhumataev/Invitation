<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Приглашение на новоселье</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=PT+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-outer:#E3DCC9;
    --bg-outer-2:#D9D0B8;
    --bg-card:#FBF8F1;
    --ink:#333A2C;
    --ink-soft2:#7A7962;
    --gold:#A5814B;
    --gold-soft:#C7A66F;
    --sage:#7C8768;
    --line:#D8CFB4;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100vh;
  }

  body{
    position:relative;
    color:var(--ink);
    font-family:'PT Serif', serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    background:linear-gradient(160deg, var(--bg-outer) 0%, var(--bg-outer-2) 100%);
  }

  /* Photo background only fades in after the envelope is opened */
  #bg-photo{
    position:fixed;
    inset:0;
    z-index:0;
    background:
      linear-gradient(180deg, rgba(51,58,44,.30) 0%, rgba(51,58,44,.55) 100%),
      url('house-bg.jpg') left center / cover no-repeat;
    opacity:0;
    transition:opacity 1.3s ease;
  }
  #bg-photo.show{
    opacity:1;
  }

  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width:640px;
    margin:0 auto;
    padding:60px 26px 90px;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    perspective:1400px;
  }

  .stack{
    position:relative;
    width:100%;
    display:grid;
  }
  .stack > *{
    grid-area:1/1;
    width:100%;
  }

  #envelope{
    position:relative;
    width:100%;
    max-width:480px;
    cursor:pointer;
    user-select:none;
    transition:opacity .7s ease .15s, transform .7s ease .15s;
  }
  #envelope.opened{
    opacity:0;
    transform:translateY(-10px) scale(.98);
    pointer-events:none;
  }

  .env-shell{
    position:relative;
    width:100%;
    aspect-ratio:16/10.4;
    background:linear-gradient(160deg,#F2ECDC,#E7DEC7);
    border:1px solid var(--line);
    box-shadow:0 18px 40px -18px rgba(51,58,44,.35);
  }

  .env-flap{
    position:absolute;
    top:0; left:0; right:0;
    height:56%;
    background:linear-gradient(150deg,#EFE8D6,#E2D8BE);
    clip-path:polygon(0 0,100% 0,50% 96%);
    border-bottom:1px solid var(--line);
    transform-origin:top center;
    transition:transform .9s cubic-bezier(.6,0,.2,1);
    z-index:3;
  }
  #envelope:hover .env-flap{ filter:brightness(1.02); }

  .env-shadow-fold{
    position:absolute;
    inset:0;
    background:linear-gradient(200deg, transparent 55%, rgba(51,58,44,.06) 100%);
    pointer-events:none;
  }

  .seal{
    position:absolute;
    top:50%; left:50%;
    width:56px; height:56px;
    transform:translate(-50%,-52%);
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #C08E52, #93693A 70%);
    box-shadow:0 3px 8px rgba(51,58,44,.35), inset 0 1px 2px rgba(255,255,255,.25);
    display:flex; align-items:center; justify-content:center;
    z-index:4;
    transition:transform .5s ease, opacity .5s ease;
  }
  .seal span{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:24px;
    color:#F6ECD8;
  }

  .env-hint{
    text-align:center;
    margin-top:22px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:18px;
    letter-spacing:.5px;
    color:#4A4A3A;
    transition:opacity .5s ease;
  }
  #envelope.opened + .env-hint{ opacity:0; }

  #letter{
    width:100%;
    max-width:520px;
    margin:0 auto;
    opacity:0;
    pointer-events:none;
    transform:translateY(26px);
    transition:opacity .8s ease .35s, transform .8s cubic-bezier(.2,.7,.2,1) .35s;
  }
  #letter.show{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }

  .card{
    background:rgba(38,42,30,.58);
    -webkit-backdrop-filter:blur(3px);
    backdrop-filter:blur(3px);
    border:1px solid rgba(255,255,255,.55);
    box-shadow:0 20px 50px -20px rgba(0,0,0,.5);
    padding:46px 22px 42px;
    position:relative;
  }

  .card::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(255,255,255,.35);
    pointer-events:none;
  }

  .sprig{
    display:block;
    width:150px;
    height:auto;
    margin:0 auto 22px;
    filter:drop-shadow(0 1px 5px rgba(0,0,0,.6));
  }

  .eyebrow{
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:17px;
    letter-spacing:2px;
    color:var(--gold-soft);
    margin:0 0 6px;
  }

  h1{
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:38px;
    line-height:1.28;
    margin:0 0 24px;
    color:#FFFFFF;
    letter-spacing:.2px;
    text-shadow:0 2px 10px rgba(0,0,0,.8), 0 1px 3px rgba(0,0,0,.9);
  }

  .poem{
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:28px;
    line-height:1.7;
    color:#FFFFFF;
    text-shadow:0 2px 8px rgba(0,0,0,.8), 0 1px 3px rgba(0,0,0,.9);
    margin:0 0 26px;
  }

  .hosts{
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:700;
    font-size:32px;
    color:#F6D488;
    text-shadow:0 2px 8px rgba(0,0,0,.8), 0 1px 3px rgba(0,0,0,.9);
    margin:26px 0 0;
  }

  .divider{
    width:60px;
    height:2px;
    background:rgba(255,255,255,.7);
    margin:0 auto 26px;
  }

  .intro{
    text-align:center;
    font-size:19px;
    line-height:1.8;
    color:var(--ink);
    margin:0 0 28px;
  }
  .intro .host{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:23px;
    color:var(--gold);
  }

  .details{
    display:flex;
    flex-direction:column;
    gap:20px;
    margin:0 0 32px;
  }
  .detail-row{
    display:flex;
    align-items:flex-start;
    gap:14px;
  }
  .detail-row svg{
    width:24px;
    height:24px;
    margin-top:2px;
    flex-shrink:0;
    color:#F6D488;
    filter:drop-shadow(0 1px 4px rgba(0,0,0,.7));
  }
  .detail-text .label{
    display:block;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:14px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:#F0EAD8;
    text-shadow:0 1px 6px rgba(0,0,0,.7);
    margin-bottom:3px;
  }
  .detail-text .value{
    font-size:20px;
    line-height:1.4;
    font-weight:700;
    color:#FFFFFF;
    text-shadow:0 2px 8px rgba(0,0,0,.8), 0 1px 3px rgba(0,0,0,.9);
  }

  .closing{
    text-align:center;
    font-size:18px;
    line-height:1.75;
    color:#F0EAD8;
    font-style:italic;
    font-family:'Cormorant Garamond', serif;
    margin:0;
  }

  .signature{
    text-align:center;
    margin-top:24px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:700;
    font-size:28px;
    color:#FFFFFF;
    text-shadow:0 2px 8px rgba(0,0,0,.8), 0 1px 3px rgba(0,0,0,.9);
  }
  .signature small{
    display:block;
    font-family:'PT Serif', serif;
    font-style:normal;
    font-size:13px;
    letter-spacing:1px;
    color:var(--ink-soft2);
    margin-top:4px;
  }

  @media (max-width:400px){
    h1{ font-size:31px; }
    .card{ padding:38px 18px 34px; }
    .sprig{ width:120px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  #confetti-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:50;
  }

  .confetti-piece{
    position:absolute;
    top:-20px;
    width:8px;
    height:14px;
    opacity:.9;
    animation-name:confetti-fall;
    animation-timing-function:cubic-bezier(.4,0,.6,1);
    animation-fill-mode:forwards;
  }

  @keyframes confetti-fall{
    0%{
      transform:translateY(0) translateX(0) rotate(0deg);
      opacity:1;
    }
    100%{
      transform:translateY(105vh) translateX(var(--drift,0px)) rotate(var(--spin,360deg));
      opacity:.85;
    }
  }
</style>
</head>
<body>

  <div id="bg-photo"></div>

  <div class="stage">
    <div class="stack">

      <div>
        <div id="envelope" tabindex="0" role="button" aria-label="Открыть письмо">
          <div class="env-shell">
            <div class="env-shadow-fold"></div>
            <div class="env-flap" id="flap"></div>
            <div class="seal" id="seal"><span>Б</span></div>
          </div>
        </div>
        <div class="env-hint">— Конвертти ачуу үчүн басыңыз —</div>
      </div>

      <div id="letter">
        <div class="card">
          <img class="sprig" src="ornament.png" alt="">

          <h1>Ардактуу жана кадырлуу коноктор!</h1>
          <p class="poem">Ак өргөө тоюбузга кош келиңиз,<br>Жакшы тилек, ак батаңыз бериңиз.<br>Сиздер берген аруу ниет, дубалар,<br>Кабыл болуп, бирге болсун дилибиз.</p>
          <div class="divider"></div>

          <div class="details">
            <div class="detail-row">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                <rect x="3.5" y="5" width="17" height="16" rx="1.5"/>
                <path d="M3.5 9.5H20.5"/>
                <path d="M8 3V6.5"/>
                <path d="M16 3V6.5"/>
              </svg>
              <div class="detail-text">
                <span class="label">Дата</span>
                <span class="value">3-сентябрь</span>
              </div>
            </div>

            <div class="detail-row">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                <path d="M12 21C12 21 19 14.5 19 9.8C19 5.9 15.9 3 12 3C8.1 3 5 5.9 5 9.8C5 14.5 12 21 12 21Z"/>
                <circle cx="12" cy="9.6" r="2.6"/>
              </svg>
              <div class="detail-text">
                <span class="label">Дареги</span>
                <span class="value">Жабинов көчөсү, 35</span>
              </div>
            </div>
          </div>

          <p class="signature">Күтөбүз!</p>
          <p class="hosts">Байыш&amp;Асель</p>
        </div>
      </div>

    </div>
  </div>

  <div id="confetti-layer"></div>

  <audio id="bg-music" src="song.mp3" preload="auto"></audio>

<script>
  const envelope = document.getElementById('envelope');
  const flap = document.getElementById('flap');
  const seal = document.getElementById('seal');
  const letter = document.getElementById('letter');
  const bgPhoto = document.getElementById('bg-photo');
  const confettiLayer = document.getElementById('confetti-layer');
  const bgMusic = document.getElementById('bg-music');
  let opened = false;

  const confettiColors = ['#C08E52', '#7C8768', '#A5814B', '#E3B04B', '#B85C5C', '#8FA6B2', '#D9D0B8'];

  function spawnConfetti(){
    const count = 70;
    for(let i = 0; i < count; i++){
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      const left = Math.random() * 100;
      const drift = (Math.random() * 160 - 80) + 'px';
      const spin = (Math.random() * 720 - 360) + 'deg';
      const duration = 2.6 + Math.random() * 1.8;
      const delay = Math.random() * 0.5;
      const color = confettiColors[Math.floor(Math.random() * confettiColors.length)];
      const isCircle = Math.random() > 0.5;
      piece.style.left = left + 'vw';
      piece.style.setProperty('--drift', drift);
      piece.style.setProperty('--spin', spin);
      piece.style.animationDuration = duration + 's';
      piece.style.animationDelay = delay + 's';
      piece.style.background = color;
      piece.style.borderRadius = isCircle ? '50%' : '2px';
      confettiLayer.appendChild(piece);
      setTimeout(() => piece.remove(), (duration + delay) * 1000 + 200);
    }
  }

  function openLetter(){
    if(opened) return;
    opened = true;
    seal.style.opacity = '0';
    seal.style.transform = 'translate(-50%,-52%) scale(.6)';
    flap.style.transform = 'rotateX(180deg)';
    bgPhoto.classList.add('show');
    setTimeout(()=>{
      envelope.classList.add('opened');
      letter.classList.add('show');
      spawnConfetti();
      bgMusic.currentTime = 0;
      bgMusic.play().catch(()=>{});
    }, 420);
  }

  envelope.addEventListener('click', openLetter);
  envelope.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openLetter(); }
  });
</script>
</body>
</html>
